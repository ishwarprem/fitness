<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitNotFat - Authentication</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Teko:wght@300;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* =========================================
           "GO CRAZY" AUTH STYLES
           ========================================= */
        :root {
            --primary-neon: #ff5e00;
            /* Acid Green */
            --secondary-neon: #ff9500;
            /* Cyan */
            --dark-bg: #0a0a0a;
            --card-bg: rgba(20, 20, 20, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #888888;
            --font-head: 'Teko', sans-serif;
            --font-body: 'Montserrat', sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: var(--font-body);
            overflow-x: hidden;
        }

        /* Hide the hero overlay wrapper in this view context if needed, 
           or ensure it sits behind everything using z-index */
        #hero-overlay {
            z-index: 9999;
            /* Depending on your flow */
            display: none;
            /* Hidden by default for the Auth demo */
        }

        /* WRAPPER */
        .auth-page-wrapper {
            display: flex;
            height: 100vh;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        /* ANIMATED BACKGROUND SHAPES (The "Crazy" Part) */
        .auth-page-wrapper::before,
        .auth-page-wrapper::after {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.4;
            animation: floatOrb 10s infinite alternate ease-in-out;
        }

        .auth-page-wrapper::before {
            background: var(--primary-neon);
            top: -10%;
            right: -10%;
        }

        .auth-page-wrapper::after {
            background: var(--secondary-neon);
            bottom: -10%;
            left: -10%;
            animation-delay: -5s;
        }

        @keyframes floatOrb {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(-50px, 50px) scale(1.1);
            }
        }

        /* LEFT PANEL - Visual Motivation */
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem;
            position: relative;
            z-index: 1;
            /* High quality gym abstract background */
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)),
                url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 100%);
            /* Slanted cut */
        }

        .left-panel h1 {
            font-family: var(--font-head);
            font-size: 6rem;
            line-height: 0.9;
            text-transform: uppercase;
            margin: 0;
            opacity: 0;
            animation: slideInLeft 1s forwards 0.5s;
        }

        .left-panel h1 span {
            color: var(--primary-neon);
            display: block;
            font-size: 8rem;
            text-shadow: 0 0 20px rgba(204, 255, 0, 0.3);
        }

        /* RIGHT PANEL - The Forms */
        .right-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
            padding: 2rem;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* Top border accent line */
        .auth-container::top {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-neon), var(--secondary-neon));
        }

        /* FORMS */
        .auth-form {
            display: none;
            /* JS toggles 'active' class */
            animation: fadeIn 0.5s ease;
        }

        .auth-form.active {
            display: block;
        }

        .form-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-header h2 {
            font-family: var(--font-head);
            font-size: 3rem;
            margin: 0;
            letter-spacing: 2px;
            background: linear-gradient(to right, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        /* INPUTS */
        .form-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .form-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-neon);
            font-size: 1rem;
            transition: 0.3s;
        }

        .form-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #333;
            padding: 15px 15px 15px 45px;
            /* Space for icon */
            border-radius: 8px;
            color: #fff;
            font-family: var(--font-body);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-neon);
            box-shadow: 0 0 15px rgba(204, 255, 0, 0.1);
            background: rgba(0, 0, 0, 0.5);
        }

        .form-group input:focus+i {
            color: #fff;
        }

        /* BUTTONS */
        .auth-btn {
            width: 100%;
            padding: 15px;
            background: var(--primary-neon);
            color: #000;
            border: none;
            border-radius: 50px;
            /* Pill shape */
            font-family: var(--font-head);
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 1rem;
        }

        .auth-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 17, 0, 0.3);
            background: #fff;
        }

        .auth-btn:active {
            transform: translateY(0);
        }

        /* LINKS & TOGGLES */
        .forgot-password {
            display: block;
            text-align: right;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .forgot-password:hover {
            color: var(--primary-neon);
        }

        .toggle-form {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #ccc;
        }

        .toggle-link {
            color: var(--secondary-neon);
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 4px;
            transition: 0.3s;
        }

        .toggle-link:hover {
            color: #fff;
        }

        /* SOCIAL ICONS */
        .social-logins {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 1.5rem;
        }

        .social-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 1px solid #333;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
        }

        .social-btn:hover {
            background: var(--primary-neon);
            color: #000;
            border-color: var(--primary-neon);
            transform: rotate(360deg);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #555;
            margin: 1.5rem 0;
            font-size: 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #333;
        }

        .divider::before {
            margin-right: .5em;
        }

        .divider::after {
            margin-left: .5em;
        }

        /* MESSAGES */
        .error-message {
            color: #ff4444;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 10px;
            min-height: 20px;
        }

        .success-message {
            color: var(--primary-neon);
            font-size: 0.85rem;
            text-align: center;
            margin-top: 10px;
        }

        /* ANIMATIONS */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .left-panel {
                display: none;
            }

            .auth-page-wrapper::before,
            .auth-page-wrapper::after {
                width: 300px;
                height: 300px;
            }
        }
    </style>
</head>

<body>

    <div class="auth-page-wrapper">
        <!-- Left Panel: Motivational Visuals -->
        <div class="left-panel">
            <h1>UNLEASH<br>YOUR<br><span>POTENTIAL</span></h1>
        </div>

        <!-- Right Panel: Forms -->
        <div class="right-panel">
            <div class="auth-container">

                <!-- Login Form -->
                <form id="loginForm" class="auth-form active">
                    <div class="form-header">
                        <h2>SIGN IN</h2>
                        <p>Welcome back. Let's destroy some goals.</p>
                    </div>

                    <div class="social-logins">
                        <div class="social-btn"><i class="fab fa-google"></i></div>
                        <div class="social-btn"><i class="fab fa-apple"></i></div>
                        <div class="social-btn"><i class="fab fa-facebook-f"></i></div>
                    </div>

                    <div class="divider">OR CONTINUE WITH</div>

                    <div class="form-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="Email Address" required>
                    </div>
                    <div class="form-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="Password" required>
                    </div>

                    <a class="forgot-password">Forgot password?</a>
                    <p id="loginError" class="error-message"></p>

                    <button type="submit" class="auth-btn">LOGIN</button>

                    <p class="toggle-form">
                        New to the arena? <span class="toggle-link" id="showRegister">Register Now</span>
                    </p>
                </form>

                <!-- Register Form -->
                <form id="registerForm" class="auth-form">
                    <div class="form-header">
                        <h2>JOIN THE SQUAD</h2>
                        <p>Start your transformation today.</p>
                    </div>

                    <div class="form-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="registerEmail" placeholder="Email Address" required>
                    </div>
                    <div class="form-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="registerPassword" placeholder="Password (min. 6 characters)"
                            required>
                    </div>
                    <div class="form-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="registerPasswordConfirm" placeholder="Confirm Password" required>
                    </div>

                    <p id="registerError" class="error-message"></p>
                    <p id="registerSuccess" class="success-message"></p>

                    <button type="submit" class="auth-btn">CREATE ACCOUNT</button>

                    <p class="toggle-form">
                        Already a member? <span class="toggle-link" id="showLogin">Login Here</span>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Auth Logic Script -->
    <script src="js/auth.js"></script>
</body>

</html>
