<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitNotFat - Authentication</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css"> <!-- We will create this new CSS file -->
</head>
<body>
    <header>
        <h1>FITNOTFAT.</h1>
    </header>

    <div class="container">
        <div class="auth-container">
            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <h2 class="form-title">MEMBER LOGIN</h2>
                <div class="form-group">
                    <input type="email" id="loginEmail" placeholder="EMAIL" required>
                </div>
                <div class="form-group">
                    <input type="password" id="loginPassword" placeholder="PASSWORD" required>
                </div>
                <p id="loginError" class="error-message"></p>
                <button type="submit" class="auth-btn">LOGIN</button>
                <p class="toggle-form">
                    No account? <span class="toggle-link" id="showRegister">Create one here.</span>
                </p>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form">
                <h2 class="form-title">CREATE ACCOUNT</h2>
                <div class="form-group">
                    <input type="email" id="registerEmail" placeholder="EMAIL" required>
                </div>
                <div class="form-group">
                    <input type="password" id="registerPassword" placeholder="PASSWORD (MIN. 6 CHARACTERS)" required>
                </div>
                <p id="registerError" class="error-message"></p>
                <p id="registerSuccess" class="success-message"></p>
                <button type="submit" class="auth-btn">REGISTER</button>
                <p class="toggle-form">
                    Already have an account? <span class="toggle-link" id="showLogin">Login here.</span>
                </p>
            </form>
        </div>
    </div>

    <footer>
        <p>© 2025 FITNOTFAT | NO PAIN, NO GAIN</p>
    </footer>

    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Auth Logic Script -->
    <script src="js/auth.js"></script>
</body>
</html>
