<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitNotFat - Authentication</title>
    <!-- Main Stylesheet (for header/footer consistency) -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Auth-Specific Stylesheet -->
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <!-- Hero Overlay -->
    <div id="hero-overlay">
        <canvas id="hero-canvas"></canvas>
        <div class="hero-content-wrapper">
            <p class="hero-subheadline">The only bad workout is the one that didn't happen.</p>
            <h1 class="hero-headline">UNLEASH YOUR POTENTIAL</h1>
        </div>

        <button id="enter-arena-btn" class="hero-btn">ENTER THE ARENA</button>
    </div>
    <script src="js/hero-overlay.js"></script>
    <link rel="stylesheet" href="css/hero-overlay.css">
    <div class="auth-page-wrapper">
        <!-- Left Panel (Desktop Only) -->
        <div class="left-panel">
            <h1>UNLEASH YOUR <span>POTENTIAL</span></h1>
        </div>

        <!-- Right Panel / Main Form Container -->
        <div class="right-panel">
            <div class="auth-container">
                <!-- Login Form -->
                <form id="loginForm" class="auth-form active">
                    <div class="form-header">
                        <h2>SIGN IN</h2>
                        <p>Welcome back. Let's get to work.</p>
                    </div>

                    <div class="social-logins">
                        <!-- SVGs for social icons are placed here for simplicity -->
                    </div>
                    <div class="divider">OR</div>

                    <div class="form-group">
                        <input type="email" id="loginEmail" placeholder="Email Address" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="loginPassword" placeholder="Password" required>
                    </div>
                    <a class="forgot-password">Forgot password?</a>
                    <p id="loginError" class="error-message"></p>
                    <button type="submit" class="auth-btn">LOGIN</button>
                    <p class="toggle-form">
                        Don’t have an account? <span class="toggle-link" id="showRegister">Register Now</span>
                    </p>
                </form>

                <!-- Register Form -->
                <form id="registerForm" class="auth-form">
                    <div class="form-header">
                        <h2>CREATE ACCOUNT</h2>
                        <p>Join the community and start your journey.</p>
                    </div>
                    <div class="form-group">
                        <input type="email" id="registerEmail" placeholder="Email Address" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="registerPassword" placeholder="Password (min. 6 characters)"
                            required>
                    </div>
                    <p id="registerError" class="error-message"></p>
                    <p id="registerSuccess" class="success-message"></p>
                    <button type="submit" class="auth-btn">CREATE ACCOUNT</button>
                    <p class="toggle-form">
                        Already have an account? <span class="toggle-link" id="showLogin">Login Here</span>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Auth Logic Script -->
    <script src="js/auth.js"></script>
</body>

</html>
